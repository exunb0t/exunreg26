name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      version-id:
        description: Version ID to roll back to (see wrangler versions list)
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler rollback ${{ inputs.version-id }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke check
        run: |
          sleep 15
          curl -sf --max-time 30 https://reg.exunclan.com/api/health | grep -q '"db":"ok"'
