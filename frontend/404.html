<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Exun 2026</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/navbar.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/query.css" />
    <link rel="stylesheet" href="/css/chat.css" />
    <style>
      .error-page {
        padding: 40px 20px 25vw;
        text-align: center;
      }
      .error-page .container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .error-page h1 {
        font-size: 48px;
        margin-bottom: 8px;
        text-align: center;
      }
      .error-page p {
        color: #6b7280;
        margin-bottom: 24px;
        text-align: center;
        max-width: 640px;
      }
      .giant-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        pointer-events: none;
        background: transparent;
        overflow: hidden;
        padding: 0;
      }
      .giant-footer__word {
        color: #2977f5;
        font-weight: 800;
        font-size: 30vw;
        line-height: 0.78;
        letter-spacing: -0.02em;
        text-align: center;
        white-space: nowrap;
        margin: 0 0 -0.06em;
      }
    </style>
  </head>
  <body data-page="404">
    <div id="navbar-container"></div>
    <main
      class="error-page"
      style="
        display: flex;
        align-items: center;
        justify-content: center;
      "
    >
      <div class="container" style="max-width: 720px">
        <h1>Page not found</h1>
        <p>
          The page you are looking for does not exist or you do not have
          permission to view it.
        </p>
        <div
          style="
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
          "
        >
          <button class="btn btn--primary" onclick="window.location.href = '/'">
            Go to Home
          </button>
          <button class="btn" onclick="window.location.href = '/login'">
            Login
          </button>
        </div>
      </div>
    </main>
    <footer class="giant-footer" aria-label="Exun 2026">
      <div class="giant-footer__word">ēxun26</div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/navigation.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        try {
          await Utils.loadComponent("/components/navbar.html", document.getElementById("navbar-container"));
        } catch (e) {}
      });
    </script>
  </body>
</html>
