<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Queries | Exun 2026</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/context-menu.css" />
    <link rel="stylesheet" href="/css/navbar.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/query.css" />
    <link rel="stylesheet" href="/css/chat.css" />
    <link rel="stylesheet" href="/css/chat-widget.css" />
  </head>
  <body data-page="query">
    <div id="navbar-container"></div>
    <main class="query-detail-page">
      <div class="query-detail-header">
        <div class="container">
          <h1 class="query-detail-title">Hi, how can we help?</h1>
          <form id="query-form" class="query-search" autocomplete="off">
            <div class="query-search-box">
              <input
                id="query-input"
                class="query-search-input"
                type="search"
                placeholder="Ask Anything"
                aria-label="Search queries"
                autocomplete="off"
              />
              <button
                id="querySearchBtn"
                class="query-search-button"
                type="submit"
                aria-label="Send search"
              >
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2977f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="rotate(45 12 12)"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></g></svg>
              </button>
            </div>
          </form>
          <p class="query-detail-subtitle">Exun 2026 support tickets</p>
        </div>
      </div>
      <section class="faq-section">
        <div class="container" id="faqContainer">
          <h2 class="faq-title">Frequently Asked Questions</h2>
        </div>
      </section>
      <section class="query-results-section">
        <div class="container" id="results">
          <p class="text-muted">No answers yet. Ask a question to get started.</p>
        </div>
      </section>
      <section class="tickets-section" id="tickets-section" style="display: none;">
        <div class="container">
          <h2 class="faq-title">My Tickets</h2>
          <div id="tickets-container"></div>
        </div>
      </section>
    </main>
    <div id="footer-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/context-menu.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/chat-widget.js"></script>
    <script src="/js/query.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        try {
          await Utils.loadComponent("/components/navbar.html", document.getElementById("navbar-container"));
          await Utils.loadComponent("/components/footer.html", document.getElementById("footer-container"));
        } catch (e) {}
      });
    </script>
  </body>
</html>
