<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Exun 2026</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/toast.css">
    <link rel="stylesheet" href="/css/query.css">
    <link rel="stylesheet" href="/css/chat.css">
</head>
<body data-page="admin">
    <div id="navbar-container"></div>

    <main class="admin-page">
        <div class="container">
            <div class="admin-dashboard">
                <div class="admin-card">
                    <div class="admin-card__header">
                        <h3 class="admin-card__title">Events</h3>
                    </div>
                    <div class="admin-card__content">
                        <div class="stat-item">
                            <span class="stat-label">Total Events:</span>
                            <span id="total-events" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Active Events:</span>
                            <span id="active-events" class="stat-value">0</span>
                        </div>
                    </div>
                </div>

                <div class="admin-card">
                    <div class="admin-card__header">
                        <h3 class="admin-card__title">Users</h3>
                    </div>
                    <div class="admin-card__content">
                        <div class="stat-item">
                            <span class="stat-label">Total Users:</span>
                            <span id="total-users" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Registrations:</span>
                            <span id="total-registrations" class="stat-value">0</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="admin-tabs">
                <button class="admin-tab admin-tab--active" data-tab="overview">Overview</button>
                <button class="admin-tab" data-tab="events">Events</button>
                <button class="admin-tab" data-tab="users">Users</button>
                <button class="admin-tab" data-tab="registrations">Registrations</button>
            </div>
            <div class="admin-content" id="admin-content">
                <div class="admin-section" id="overview-section">
                    <h2>System Overview</h2>
                    <div class="admin-grid">
                        <div class="loading-placeholder">Loading admin content...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <div id="admin-modal" class="admin-modal">
        <div class="admin-modal__content" id="modal-content">
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/admin.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', async function() {
        try {
            await Utils.loadComponent("/components/navbar.html", document.getElementById("navbar-container"));
            await Utils.loadComponent("/components/footer.html", document.getElementById("footer-container"));
        } catch (e) {}
        if (document.body && document.body.getAttribute('data-page') === 'admin') {
            window.adminPage = new AdminPage();
        }
    });
    </script>
</body>
</html>
