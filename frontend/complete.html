<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Complete Signup | Exun 2026</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/complete.css" />
    <link rel="stylesheet" href="/css/toast.css" />
  </head>
  <body data-page="complete">
    <main class="login-page">
      <div class="login-container">
        <div class="login-header">
          <img src="/assets/exun.png" class="login-logo" alt="Exun Clan" />
          <h1 class="login-title">Complete your profile</h1>
          <p class="login-subtitle">
            Provide the remaining details to finish your account.
          </p>
        </div>

        <div class="complete-grid">
          <div id="profile-section" class="profile-panel">
            <form class="login-form" id="complete-profile-form" autocomplete="off" spellcheck="false">
              <div class="profile-grid">
                <div class="form-group" id="institution-field">
                  <label class="form-label" for="institution_name">Institution name</label>
                  <input class="form-input" id="institution_name" name="institution_name" type="text" autocomplete="off" />
                </div>

                <div class="form-group" id="fullname-field" style="display: none">
                  <label class="form-label" for="fullname">Full name</label>
                  <input class="form-input" id="fullname" name="fullname" type="text" autocomplete="off" />
                </div>

                <div class="form-group phone-half phone-right" id="phone-field">
                  <label class="form-label" for="phone_number">Phone number</label>
                  <input class="form-input" id="phone_number" name="phone_number" type="tel" autocomplete="off" inputmode="tel" placeholder="+91 XXXXX XXXXX" />
                </div>

                <div class="form-group full-span" id="address-field">
                  <label class="form-label" for="address">Address</label>
                  <input class="form-input" id="address" name="address" type="text" autocomplete="off" />
                </div>

                <div class="form-group" id="principal-name-field">
                  <label class="form-label" for="principals_name">Principal's name</label>
                  <input class="form-input" id="principals_name" name="principals_name" type="text" autocomplete="off" />
                </div>

                <div class="form-group" id="principal-email-field">
                  <label class="form-label" for="principals_email">Principal's email</label>
                  <input class="form-input" id="principals_email" name="principals_email" type="email" autocomplete="off" />
                </div>
              </div>
              <div class="form-group">
                <label class="checkbox-wrapper" id="individual-wrapper">
                  <span class="form-label">Individual</span>
                  <input type="checkbox" id="individual" name="individual" class="checkbox-input" />
                  <span class="checkbox-custom" aria-hidden="true"></span>
                </label>
              </div>
              <div class="form-group button-row">
                <button class="login-btn" type="button" id="save-profile">
                  Save profile
                </button>
                <button class="btn btn--secondary login-btn" type="button" id="back-to-profile">
                  Back to summary
                </button>
              </div>
            </form>
          </div>
        </div>

        <div id="message" style="margin-top: 12px"></div>
      </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/complete.js"></script>
  </body>
</html>
